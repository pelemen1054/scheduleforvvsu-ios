name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Release tag ($TAG_VERSION) does not match VERSION ($FILE_VERSION)."
            exit 1
          fi

      - name: Set up XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project VVSUTimetable.xcodeproj \
            -scheme VVSUTimetable \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Build succeeded but no .app bundle was found. Available products:"
            find build/DerivedData/Build/Products -maxdepth 3 -print || true
            exit 1
          fi
          echo "Packaging simulator app: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" VVSUTimetable-iOS-Simulator.zip

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVSUTimetable-iOS-Simulator-v${{ steps.version.outputs.version }}
          path: VVSUTimetable-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)"
          {
            echo "# ВВГУ timetable iOS v${{ steps.version.outputs.version }}"
            echo
            awk '/^## \\[1.0.4\\]/{show=1} show{print}' CHANGELOG.md
            echo
            echo "## Полный журнал коммитов"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Изменения с релиза `$PREVIOUS_TAG`:"
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)' "$PREVIOUS_TAG..$GITHUB_SHA"
            else
              echo "Изменения с начала истории проекта:"
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)' "$GITHUB_SHA"
            fi
            echo
            echo
            echo "---"
            echo
            echo "**Важно:** приложенный ZIP содержит сборку для iOS Simulator и не устанавливается на обычный iPhone. Это не IPA."
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ВВГУ timetable iOS v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: VVSUTimetable-iOS-Simulator.zip
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
